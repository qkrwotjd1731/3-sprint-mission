name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL 서비스 컨테이너 (테스트용 DB 자동 생성)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: test-sprint_mission
        ports:
          - 5432:5432
        # DB 준비 완료까지 대기
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설치
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: 패키지 설치
        run: npm install

      - name: TypeScript 타입 체크
        run: npm run build

      - name: DB 스키마 생성 (테이블 생성)
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/test-sprint_mission?schema=public
        run: npx prisma migrate deploy

      - name: 테스트 데이터 삽입
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/test-sprint_mission?schema=public
        run: npx prisma db seed

      - name: 테스트 실행
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/test-sprint_mission?schema=public
          NODE_ENV: test
          PORT: 3000
          ACCESS_TOKEN_SECRET: test_access_token_secret_key_for_ci
          REFRESH_TOKEN_SECRET: test_refresh_token_secret_key_for_ci
        run: npm run test:all
